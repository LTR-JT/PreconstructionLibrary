name: Checks and build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pinned Lua 5.4
        run: python Tools/build_ci_lua.py
      - name: Run checks
        run: python Tools/check.py --lua Tests/ci-lua/lua.exe
      - name: Build native components
        run: python Tools/build_native.py
      - name: Prepare install packages
        run: python Tools/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: PreconstructionLibrary-preview
          path: Releases/
